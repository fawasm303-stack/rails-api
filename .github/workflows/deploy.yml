name: CI/CD - Deploy

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  AWS_REGION: me-central-1
  TF_DIR: infra

  # Update if your names differ
  ECR_REPO_NAME: rails-api
  ECS_CLUSTER_NAME: rails-api-cluster
  ECS_SERVICE_NAME: rails-api-svc

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # -----------------------
      # Stage 0: Checkout
      # -----------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------
      # Stage 1: AWS Auth (OIDC)
      # -----------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install jq (if missing)
        run: |
          set -e
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      # -----------------------
      # Stage 2: Compute image tag (short SHA like CodeBuild)
      # -----------------------
      - name: Compute image tag (short commit hash)
        id: tag
        run: |
          set -euo pipefail
          COMMIT_HASH="$(echo "${GITHUB_SHA}" | cut -c 1-7)"
          IMAGE_TAG="${COMMIT_HASH:=latest}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}"

      # -----------------------
      # Stage 3: Terraform Plan & Apply (creates ECR + ECS task def update)
      # -----------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.2"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="image_tag=${{ steps.tag.outputs.image_tag }}"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="image_tag=${{ steps.tag.outputs.image_tag }}"

      # -----------------------
      # Stage 4: Build & Push Docker Image (after ECR repo exists)
      # -----------------------
      - name: Build & Push to ECR
        id: image
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPO_NAME}:${{ steps.tag.outputs.image_tag }}"

          echo "Logging into ECR..."
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

          echo "Building image: ${IMAGE_URI}"
          docker build -t "${IMAGE_URI}" .

          echo "Pushing image: ${IMAGE_URI}"
          docker push "${IMAGE_URI}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      # -----------------------
      # Stage 5: Deploy to ECS (force new deployment)
      # -----------------------
      - name: Force new deployment
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${ECS_CLUSTER_NAME}" \
            --service "${ECS_SERVICE_NAME}" \
            --force-new-deployment \
            --region "${AWS_REGION}" >/dev/null

      - name: Wait for ECS service stable
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}"

      # -----------------------
      # Stage 6: Post-deploy verification
      # -----------------------
      - name: Get health URL from Terraform output
        id: out
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          HEALTH_URL="$(terraform output -raw health_url)"
          echo "health_url=${HEALTH_URL}" >> "$GITHUB_OUTPUT"
          echo "Health URL: ${HEALTH_URL}"

      - name: Verify /health returns {"status":"ok"}
        run: |
          set -euo pipefail
          URL="${{ steps.out.outputs.health_url }}"
          echo "Checking: ${URL}"

          for i in {1..20}; do
            BODY="$(curl -fsS "${URL}" || true)"
            if echo "${BODY}" | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo "OK: ${BODY}"
              exit 0
            fi
            echo "Attempt $i failed: ${BODY}"
            sleep 5
          done

          echo "FAILED health check"
          exit 1

      # -----------------------
      # Stage 7: Slack notify (optional)
      # -----------------------
      - name: Slack notify
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="*Deploy ${STATUS}*\nRegion: ${AWS_REGION}\nSHA: ${{ github.sha }}\nImage: ${{ steps.image.outputs.image_uri }}\nHealth: ${{ steps.out.outputs.health_url }}\nRun: ${RUN_URL}"

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No SLACK_WEBHOOK_URL set. Skipping Slack."
            exit 0
          fi

          curl -X POST -H "Content-type: application/json" \
            --data "$(jq -n --arg text "${MSG}" '{text: $text}')" \
            "${SLACK_WEBHOOK_URL}"

