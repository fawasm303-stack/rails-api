name: Deploy to AWS ECS

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: me-central-1
  TF_DIR: infra

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.2"

      - name: Terraform → Build → Deploy → Verify
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          # Image tag 
          COMMIT_HASH="$(echo "${GITHUB_SHA}" | cut -c 1-7)"
          IMAGE_TAG="${COMMIT_HASH:=latest}"
          echo "IMAGE_TAG=${IMAGE_TAG}"

          # Terraform
          cd "${TF_DIR}"
          terraform init
          terraform plan -out=tfplan -var="aws_region=${AWS_REGION}" -var="image_tag=${IMAGE_TAG}"
          terraform apply -auto-approve tfplan

          # Read outputs
          ECS_CLUSTER="$(terraform output -raw ecs_cluster)"
          ECS_SERVICE="$(terraform output -raw ecs_service)"
          ECR_REPO_URL="$(terraform output -raw ecr_repo)"
          HEALTH_URL="$(terraform output -raw health_url)"

          IMAGE_URI="${ECR_REPO_URL}:${IMAGE_TAG}"
          ECR_REGISTRY="$(echo "${ECR_REPO_URL}" | cut -d/ -f1)"

          echo "ECS_CLUSTER=${ECS_CLUSTER}"
          echo "ECS_SERVICE=${ECS_SERVICE}"
          echo "IMAGE_URI=${IMAGE_URI}"
          echo "HEALTH_URL=${HEALTH_URL}"

          cd ..

          # Build & Push image
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

          # Force ECS deployment
          aws ecs update-service --cluster "${ECS_CLUSTER}" --service "${ECS_SERVICE}" --force-new-deployment --region "${AWS_REGION}" >/dev/null

          aws ecs wait services-stable --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" --region "${AWS_REGION}"

          # Health_check
          OK=0
          for i in {1..20}; do
            CODE="$(curl -sS -o /dev/null -w "%{http_code}" "${HEALTH_URL}" || true)"
            echo "Attempt $i: HTTP ${CODE}"
            if [ "${CODE}" = "200" ]; then
              echo "Health OK"
              OK=1
              break
            fi
            sleep 5
          done

          if [ "${OK}" -ne 1 ]; then
            echo "Health check FAILED"
            exit 1
          fi

          # Slack notification 
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            # ensure jq exists (most self-hosted runners have it; install if missing)
            if ! command -v jq >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y jq
            fi

            MSG=$'Deployment Success\nCommit ID: '"${GITHUB_SHA}"$'\nURL: '"${HEALTH_URL}"
            curl -X POST -H "Content-type: application/json" \
              --data "$(jq -n --arg text "${MSG}" '{text: $text}')" \
              "${SLACK_WEBHOOK_URL}" >/dev/null || true
          fi

