name: Deploy (ECR + Terraform + ECS)

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: me-central-1
  TF_DIR: infra

  # Update these if your terraform created different names
  ECR_REPO_NAME: rails-api
  ECS_CLUSTER_NAME: rails-api-cluster
  ECS_SERVICE_NAME: rails-api-svc

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1) Auth to AWS using OIDC
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install tools (jq)
        run: sudo apt-get update && sudo apt-get install -y jq

      # 2) Build & Push Docker image to ECR (tag = commit SHA)
      - name: Build & Push to ECR
        id: image
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          IMAGE_TAG="${GITHUB_SHA}"
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPO_NAME}:${IMAGE_TAG}"

          # create repo if missing (first run safe)
          aws ecr describe-repositories --repository-names "${ECR_REPO_NAME}" --region "${AWS_REGION}" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "${ECR_REPO_NAME}" --region "${AWS_REGION}" >/dev/null

          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      # 3) Terraform plan & apply (updates task definition image_tag)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="image_tag=${{ steps.image.outputs.image_tag }}"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="image_tag=${{ steps.image.outputs.image_tag }}"

      # 4) Force ECS deployment + wait
      - name: Force new deployment
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${ECS_CLUSTER_NAME}" \
            --service "${ECS_SERVICE_NAME}" \
            --force-new-deployment \
            --region "${AWS_REGION}" >/dev/null

      - name: Wait for service stable
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --region "${AWS_REGION}"

      # 5) Verify /health returns {"status":"ok"}
      - name: Read health URL from Terraform output
        id: out
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          HEALTH_URL="$(terraform output -raw health_url)"
          echo "health_url=${HEALTH_URL}" >> "$GITHUB_OUTPUT"
          echo "Health URL: ${HEALTH_URL}"

      - name: Verify health
        run: |
          set -euo pipefail
          URL="${{ steps.out.outputs.health_url }}"
          for i in {1..20}; do
            BODY="$(curl -fsS "${URL}" || true)"
            if echo "${BODY}" | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo "OK: ${BODY}"
              exit 0
            fi
            echo "Attempt $i failed: ${BODY}"
            sleep 5
          done
          echo "Health check FAILED"
          exit 1

      # 6) Slack notify (optional)
      - name: Slack notify
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="*Deploy ${STATUS}*\nSHA: ${{ github.sha }}\nImage: ${{ steps.image.outputs.image_uri }}\nHealth: ${{ steps.out.outputs.health_url }}\nRun: ${RUN_URL}"

          # If Slack webhook is not set, skip quietly
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No SLACK_WEBHOOK_URL set. Skipping Slack."
            exit 0
          fi

          curl -X POST -H "Content-type: application/json" \
            --data "$(jq -n --arg text "${MSG}" '{text: $text}')" \
            "${SLACK_WEBHOOK_URL}"

